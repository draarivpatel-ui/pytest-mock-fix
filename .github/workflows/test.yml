name: CI

on:
  push:
    branches: [fix-stub-coroutine]
  pull_request:
    branches: [fix-stub-coroutine]

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash pinned test tooling
        run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Install package without unhashpinned dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run pytest suite
        run: python -m pytest tests --color=no

  package:
    name: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install hash pinned build tooling
        run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Build source and wheel distributions
        run: python -m build --no-isolation
